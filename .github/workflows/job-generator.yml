name: lint-job-generator
on: [push, pull_request]
permissions:
  contents: read
jobs:
    mypy-linter:
        name: run mypy linter
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
          with:
            persist-credentials: false
        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            python-version: "3.14"
            architecture: x64
        - name: Install alpaka-bashi
          run: |
            pip install ${GITHUB_WORKSPACE}/script/job_generator
        - name: Install mypy
          run: |
            pip install mypy
        - name: Run mypy on alpaka-bashi source code
          run: |
            mypy ${GITHUB_WORKSPACE}/script/job_generator/src/alpaka_bashi
        - name: Run mypy on job-generator and alpaka-validate
          run: |
            mypy ${GITHUB_WORKSPACE}/script/job_generator/src/apps

    pylint-linter:
        name: run pylint linter
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
          with:
            persist-credentials: false
        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            python-version: "3.14"
            architecture: x64
        - name: Install alpaka-bashi
          run: |
            pip install ${GITHUB_WORKSPACE}/script/job_generator
        - name: Install pylint
          run: |
            pip install pylint
        - name: Run pylint on alpaka-bashi source code
          run: |
            pylint ${GITHUB_WORKSPACE}/script/job_generator/src/alpaka_bashi
        - name: Run pylint on job-generator and alpaka-validate
          run: |
            pylint ${GITHUB_WORKSPACE}/script/job_generator/src/apps

    unit-tests:
      name: run unit tests
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - name: Set up Python
          uses: actions/setup-python@v7
          with:
            python-version: "3.13"
            architecture: x64
        - name: Install alpaka-bashi
          run: |
            pip install ./script/job_generator
        - name: Run alpaka-bashi test
          run: |
            python -m unittest discover -s ./script/job_generator/tests -p "*.py"
